{% extends "base.html" %}

{% block title %}Inscription - Ttrust{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center py-12 px-4">
    <div class="glass-card p-8 w-full max-w-md animate-fade-in-up">
        <div class="text-center mb-8">
            <div class="w-16 h-16 mx-auto mb-4 rounded-2xl flex items-center justify-center" style="background: var(--gradient-primary); box-shadow: 0 8px 30px rgba(99, 102, 241, 0.3);">
                <i class="fas fa-user-plus text-2xl text-white"></i>
            </div>
            <h1 class="text-2xl font-bold mb-2">Créer un compte</h1>
            <p style="color: var(--text-secondary);">Rejoignez la plateforme Ttrust</p>
        </div>

        <form id="registerForm" class="space-y-5">
            <div class="grid grid-cols-2 gap-4">
                <div class="form-group mb-0">
                    <label class="form-label">Prénom</label>
                    <input type="text" id="first_name" required class="input-modern" placeholder="Votre prénom">
                </div>
                <div class="form-group mb-0">
                    <label class="form-label">Nom</label>
                    <input type="text" id="last_name" required class="input-modern" placeholder="Votre nom">
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" id="email" required class="input-modern" placeholder="votre@email.com">
            </div>

            <div class="form-group">
                <label class="form-label">Mot de passe</label>
                <input type="password" id="password" required class="input-modern" placeholder="Minimum 6 caractères">
            </div>

            <div class="form-group">
                <label class="form-label">Confirmer le mot de passe</label>
                <input type="password" id="confirm_password" required class="input-modern" placeholder="Confirmez votre mot de passe">
            </div>

            <div class="form-group">
                <label class="form-label">Code de parrainage (optionnel)</label>
                <input type="text" id="referral_code" class="input-modern" placeholder="Code parrain">
            </div>

            <div class="flex items-start gap-3">
                <input type="checkbox" id="terms" required class="mt-1" style="accent-color: var(--accent-primary);">
                <label for="terms" class="text-sm" style="color: var(--text-secondary);">
                    J'accepte les <a href="#" style="color: var(--accent-primary);" class="hover:underline">conditions d'utilisation</a>
                </label>
            </div>

            <button type="submit" class="btn btn-primary w-full py-3 text-base">
                <i class="fas fa-rocket"></i>
                Créer mon compte
            </button>
        </form>

        <div class="mt-8 pt-6" style="border-top: 1px solid var(--border-subtle);">
            <p class="text-center text-sm" style="color: var(--text-secondary);">
                Déjà un compte? 
                <a href="{{ url_for('login') }}" class="font-semibold hover:underline" style="color: var(--accent-primary);">Se connecter</a>
            </p>
        </div>
    </div>
</div>

<script>
document.getElementById('registerForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirm_password').value;
    
    if (password !== confirmPassword) {
        showToast('Les mots de passe ne correspondent pas', 'error');
        return;
    }
    
    if (password.length < 6) {
        showToast('Le mot de passe doit contenir au moins 6 caractères', 'error');
        return;
    }
    
    const btn = this.querySelector('button[type="submit"]');
    const originalHtml = btn.innerHTML;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Création...';
    btn.disabled = true;
    
    const formData = {
        first_name: document.getElementById('first_name').value,
        last_name: document.getElementById('last_name').value,
        email: document.getElementById('email').value,
        password: password,
        referral_code: document.getElementById('referral_code').value
    };
    
    try {
        const response = await fetch('/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(formData)
        });
        
        const data = await response.json();
        
        if (data.success) {
            showToast('Compte créé avec succès!', 'success');
            setTimeout(() => {
                window.location.href = data.redirect;
            }, 1500);
        } else {
            showToast(data.error || 'Erreur lors de la création du compte', 'error');
            btn.innerHTML = originalHtml;
            btn.disabled = false;
        }
    } catch (error) {
        showToast('Erreur de connexion', 'error');
        btn.innerHTML = originalHtml;
        btn.disabled = false;
    }
});
</script>
{% endblock %}
